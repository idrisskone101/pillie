# THIS IS AUTOGENERATED. DO NOT EDIT MANUALLY
version = 1
name = "Pillie iOS"

[setup]
script = '''
set -euo pipefail

chmod +x Pillie/scripts/build-and-run.sh
chmod +x Pillie/scripts/create-worktree.sh 2>/dev/null || true

if [[ "$PWD" == "$HOME/.codex/worktrees/"* ]]; then
  WORKTREE_ID="$(basename "$(dirname "$PWD")")"
  DERIVED_DATA="/tmp/PillieDerivedData-codex-$WORKTREE_ID"
else
  REPO_NAME="$(basename "$PWD")"
  if [[ "$REPO_NAME" == "Pillie" ]]; then
    DERIVED_DATA="/tmp/PillieDerivedData"
  else
    SAFE_NAME="$(printf "%s" "$REPO_NAME" | tr -cs '[:alnum:]_.-' '-' | sed 's/^-//; s/-$//')"
    DERIVED_DATA="/tmp/PillieDerivedData-$SAFE_NAME"
  fi
fi

echo "Pillie worktree ready."
echo "DerivedData: $DERIVED_DATA"
echo "Build: Pillie/scripts/build-and-run.sh --build-only"
echo "Run: Pillie/scripts/build-and-run.sh"
'''

[[actions]]
name = "Build"
icon = "test"
command = "Pillie/scripts/build-and-run.sh --build-only"

[[actions]]
name = "Build and Run"
icon = "run"
command = "Pillie/scripts/build-and-run.sh"

[[actions]]
name = "Open in Xcode"
icon = "tool"
command = "open Pillie/Pillie.xcodeproj"

[[actions]]
name = "Show Booted Simulator"
icon = "debug"
command = "xcrun simctl list devices booted"
