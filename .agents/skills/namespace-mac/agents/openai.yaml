interface:
  display_name: "Namespace Mac"
  short_description: "Start the on-demand Namespace macOS Devbox for iOS verify. Leave it running until the user asks to stop."
  default_prompt: "If this machine is Linux and the task needs Xcode or the simulator, load namespace-mac. Prefer make ns-mac-verify or make ns-mac-screenshot. For several remote commands, start pillie-ios, sync, and exec over native SSH. Do not make ns-mac-stop unless the user asked. Do not use Idriss's MacBook, the devbox CLI, nsc ssh, nsc proxy, githubrunner, or Expire. Boot the simulator before install or screenshot."
