interface:
  display_name: "Namespace Mac"
  short_description: "Start the on-demand Namespace macOS Devbox for iOS verify. Leave it running until the user asks to stop."
  default_prompt: "If this machine is Linux and the task needs Xcode or the simulator, load verify-pillie and namespace-mac. The proof command is make ns-mac-qa. Do not make ns-mac-stop unless the user asked. Do not use Idriss's MacBook, the devbox CLI, nsc ssh, nsc proxy, githubrunner, or Expire."
