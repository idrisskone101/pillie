# Canonical Namespace macOS Devbox for Pillie iOS verify.
# Workspace Personal allows one Devbox per user. Do not create a second.
# Cost: size M is the smallest macOS shape. Idle 15m is the platform minimum.
# Volume 100 GiB stays in one 100 GB storage block; the default 150 GiB is two.
# DerivedData stays in /tmp on the Mac, so the volume only needs the checkout.
name: pillie-ios
image: goldengate
size: m
access_mode: private
auto_stop_idle_timeout: 15m
volume_size_gb: 100
repository:
  url: github.com/idrisskone101/pillie
