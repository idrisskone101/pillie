name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, edited, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Only run when "@claude" is mentioned in the comment / issue / review.
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    # macOS runner so the iOS toolchain (Xcode, simulators, xcodebuildmcp, axe)
    # is available — required for the pillie-ios / Xcode 27 skills to work.
    # NOTE: macOS runners bill ~10x ubuntu minutes.
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      # Claude needs write access to push branches, open PRs, and comment back
      # on the issue/PR that invoked it. Read-only permissions let the action
      # start, but prevent it from actually delivering code changes.
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    env:
      # App Store Connect credentials for the `asc` CLI. HAS_ASC gates the ASC
      # steps below so they are skipped entirely (zero runner cost) until these
      # repo secrets are configured; the moment they exist, the steps activate.
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
      ASC_APP_ID: "6759352439"
      HAS_ASC: ${{ secrets.ASC_KEY_ID != '' && secrets.ASC_PRIVATE_KEY_B64 != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Select latest Xcode
        run: |
          XCODE_APP="$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)"
          echo "Selecting $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version

      # Apple's official Xcode 27 Agent Skills (swiftui-specialist,
      # swiftui-whats-new-27, test-modernizer, device-interaction,
      # uikit-app-modernization, audit-xcode-security-settings,
      # c-bounds-safety) ship inside Xcode itself. Export them from the
      # selected Xcode instead of committing copies to this public repo,
      # so they always match the toolchain in use.
      #
      # IMPORTANT: this export has hung indefinitely on the CI runner (no output
      # for 19-45 min, then the job hit its 45-min timeout and the "Run Claude
      # Code" step was skipped — Claude never ran, never commented, never opened
      # PRs). It is therefore time-boxed and non-fatal: if it stalls or fails, the
      # job kills just this step and still proceeds to run Claude (without these
      # optional Apple skills) rather than burning the whole budget.
      - name: Install Apple Xcode Agent Skills
        continue-on-error: true
        timeout-minutes: 5
        run: |
          mkdir -p ~/.claude/skills
          xcrun mcpbridge run-agent skills export \
            --output-dir ~/.claude/skills \
            --replace-existing
          ls ~/.claude/skills

      - name: Install XcodeBuildMCP CLI and skill
        continue-on-error: true
        timeout-minutes: 10
        run: |
          npm install -g xcodebuildmcp
          xcodebuildmcp init --dest ~/.claude/skills --force --style minimal

      - name: Install AXe (simulator accessibility automation)
        continue-on-error: true
        timeout-minutes: 10
        run: brew install cameroncooke/axe/axe

      # Keep the App Store marketing version ahead of what's already shipped so
      # Xcode Cloud deliveries never fail with ITMS-90186 ("train closed") /
      # ITMS-90062 ("version must be higher"). Installs the App Store Connect CLI
      # (asccli.sh) and runs scripts/ensure-marketing-version.mjs, which asks ASC
      # whether the current MARKETING_VERSION is on a closed train and, if so,
      # bumps it in the working tree. Claude then includes the bump in whatever
      # commit/PR it produces. Both steps are skipped until the ASC_* secrets exist.
      - name: Set up App Store Connect CLI
        if: env.HAS_ASC == 'true'
        continue-on-error: true
        timeout-minutes: 5
        uses: rudrankriyam/setup-asc@v1
        with:
          version: latest

      - name: Ensure marketing version is shippable
        if: env.HAS_ASC == 'true'
        continue-on-error: true
        timeout-minutes: 5
        run: node scripts/ensure-marketing-version.mjs

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Repo settings (.claude/settings.json — effortLevel, permission
          # allowlist) and repo skills (.claude/skills/) load automatically
          # from the checkout; only the MCP servers need explicit wiring.
          claude_args: |
            --mcp-config .github/claude-mcp-config.json
