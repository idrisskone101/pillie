name: Swift taste

on:
  pull_request:
    branches: [main]
  push:

permissions:
  contents: read

jobs:
  swift-taste:
    name: swift-taste
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Prove the checker
        run: make swift-taste-selftest
      - name: Gate app sources
        run: make swift-taste
